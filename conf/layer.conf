# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "homeassistant"
BBFILE_PATTERN_homeassistant = "^${LAYERDIR}/"
BBFILE_PRIORITY_homeassistant = "10"

# Temporary compatibility pin for Core 2026.3.1; remove when its test pin changes.
PREFERRED_VERSION_python3-pytest-asyncio = "1.3.0"

LAYERDEPENDS_homeassistant = "\
    core \
    clang-revival-layer \
    multimedia-layer \
    meta-python \
    meta-python-ai \
    meta-sca \
    networking-layer \
    openembedded-layer \
"

LAYERSERIES_COMPAT_homeassistant = "wrynose blacksail"

# The dynamic-layers directory hosts the extensions and layer specific
# modifications.
#
# The .bbappend and .bb files are included if the respective layer
# collection is available.
BBFILES += "${@' '.join('${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bbappend' % layer \
               for layer in BBFILE_COLLECTIONS.split())}"
BBFILES += "${@' '.join('${LAYERDIR}/dynamic-layers/%s/recipes*/*/*.bb' % layer \
               for layer in BBFILE_COLLECTIONS.split())}"

BBFILES_DYNAMIC += "\
    swupdate:${LAYERDIR}/dynamic-layers/swupdate/*/*/*.bb \
    swupdate:${LAYERDIR}/dynamic-layers/swupdate/*/*/*.bbappend \
"

# Recommended dependencies for dynamic-layers
LAYERRECOMMENDS_homeassistant = "\
    swupdate \
"

# This recipe is a duplicate of meta-openembedded. The latter is better maintained and should be preferred if available.
BBMASK += "meta-python-ai/recipes-python-updates/twine/python3-requests-toolbelt_1.0.0.bb"
BBMASK += "meta-python-ai/recipes-python/dunamai/python3-dunamai_1.26.0.bb"
