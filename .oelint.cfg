[oelint]
suppress=
    oelint.var.suggestedvar.BUGTRACKER
    oelint.var.suggestedvar.SECTION
    oelint.var.suggestedvar.CVE_PRODUCT
    oelint.var.mandatoryvar.DESCRIPTION
    oelint.var.bbclassextend
    oelint.vars.summary80chars
    oelint.vars.noncoreoverride
hide = info
constantmods=
    +oelint.constants.overrides.json
extra_layer=
    core
    filesystems-layer
    homeassistant
    meta-python
    openembedded-layer
    raspberrypi
    virtualization-layer
    yocto
release=blacksail
