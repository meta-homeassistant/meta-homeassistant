name: Set GitHub commit status
description: "Set a GitHub commit status without logging API response bodies."
inputs:
  status-token:
    description: 'GitHub token for statuses (optional)'
    required: false
  github-status-context:
    description: 'Status context (e.g. gitea/homeassistant-build)'
    required: true
  github-status-repository:
    description: 'Repository owner/name to update (e.g. owner/repo)'
    required: true
  sha:
    description: 'Commit SHA to set the status for'
    required: true
  state:
    description: 'Status state to set: pending, success, or failure'
    required: true
runs:
  using: composite
  steps:
    - name: Set commit status
      shell: bash
      env:
        STATUS_TOKEN: ${{ inputs.status-token }}
        GITHUB_STATUS_REPOSITORY: ${{ inputs.github-status-repository }}
        GITHUB_STATUS_CONTEXT: ${{ inputs.github-status-context }}
        GIT_COMMIT_SHA: ${{ inputs.sha }}
        STATUS_STATE: ${{ inputs.state }}
      run: python3 "${GITHUB_ACTION_PATH}/status.py"
