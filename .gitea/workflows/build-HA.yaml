name: Gitea HomeAssistant Validation
run-name: ${{ gitea.actor }} is validating HomeAssistant
on:
  push:

jobs:
  Validate:
    runs-on: yocto-builder
    env:
      GITHUB_STATUS_CONTEXT: gitea/homeassistant-build
      GITHUB_STATUS_REPOSITORY: meta-homeassistant/meta-homeassistant
      RUNNER_TOOL_CACHE: /toolcache
      CI_REPOSITORY: ${{ gitea.repository }}
      CI_REF: ${{ gitea.ref }}
      CI_RUN_ID: ${{ gitea.run_id }}
      CI_RUN_ATTEMPT: ${{ gitea.run_attempt }}
      CI_STATE_ROOT: /cache/builddir/homeassistant-ci
    container:
      volumes:
        - /cache/:/cache/
        - /dev/kvm:/dev/kvm/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pending validation
        uses: ./.gitea/actions/github-status
        with:
          status-token: ${{ secrets.STATUS_TOKEN }}
          github-status-context: ${{ env.GITHUB_STATUS_CONTEXT }}
          github-status-repository: ${{ env.GITHUB_STATUS_REPOSITORY }}
          sha: ${{ gitea.sha }}
          state: pending

      - name: Test CI scripts
        shell: bash
        run: |
          python3 -m unittest \
            tests.unit.test_ci_validation \
            tests.unit.test_github_status

      - name: Acquire shared build
        id: acquire
        shell: bash
        run: python3 scripts/ci-validate.py acquire --state-root "$CI_STATE_ROOT"

      - name: Detect changed recipes
        id: plan
        shell: bash
        run: python3 scripts/ci-validate.py plan --state-root "$CI_STATE_ROOT"

      - name: Prepare build environment
        id: prepare
        shell: bash
        run: python3 scripts/ci-validate.py prepare --state-root "$CI_STATE_ROOT"

      - name: Build and test changed dependency ptest images
        id: ptests
        continue-on-error: true
        shell: bash
        run: python3 scripts/ci-validate.py ptests --state-root "$CI_STATE_ROOT"

      - name: Build and test full Home Assistant image
        id: image
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: python3 scripts/ci-validate.py image --state-root "$CI_STATE_ROOT"

      # Future advisory lint/integration stages belong here as separate steps
      # with continue-on-error: true. They must not gate baseline promotion.
      - name: Record required validation result
        if: ${{ always() && steps.plan.outcome == 'success' }}
        shell: bash
        run: python3 scripts/ci-validate.py finish --state-root "$CI_STATE_ROOT"

      - name: Release shared build
        if: always()
        shell: bash
        run: python3 scripts/ci-validate.py release --state-root "$CI_STATE_ROOT"

      - name: Validation succeeded
        if: success()
        uses: ./.gitea/actions/github-status
        with:
          status-token: ${{ secrets.STATUS_TOKEN }}
          github-status-context: ${{ env.GITHUB_STATUS_CONTEXT }}
          github-status-repository: ${{ env.GITHUB_STATUS_REPOSITORY }}
          sha: ${{ gitea.sha }}
          state: success

      - name: Validation failed or cancelled
        if: failure() || cancelled()
        uses: ./.gitea/actions/github-status
        with:
          status-token: ${{ secrets.STATUS_TOKEN }}
          github-status-context: ${{ env.GITHUB_STATUS_CONTEXT }}
          github-status-repository: ${{ env.GITHUB_STATUS_REPOSITORY }}
          sha: ${{ gitea.sha }}
          state: failure
